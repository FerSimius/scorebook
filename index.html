<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>野球スコアブック（早稲田式）</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="スコアブック">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    /* functional ink colors = the scoring convention */
    --ink:#1c1c1c;        /* black: default */
    --ink-hit:#c0392b;    /* red: hit / run */
    --ink-blue:#1f5fbf;   /* blue: walk / hbp / sacrifice */
    --paper:#faf8f2;      /* scoresheet paper */
    --surface:#ffffff;
    --line:#d9d4c6;       /* ruled lines */
    --line-strong:#b7b0a0;
    --field:#2f7d4f;      /* field green accent */
    --field-soft:#e5f0e8;
    --text:#1c1c1c;
    --muted:#6b6b6b;
    --shadow:rgba(40,40,30,.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e9e6dd; --ink-hit:#ff6b5e; --ink-blue:#6fa8ff;
      --paper:#20211d; --surface:#26271f; --line:#3a3b33; --line-strong:#54554a;
      --field:#4bbd7a; --field-soft:#243026; --text:#e9e6dd; --muted:#9a9a90; --shadow:rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --ink:#e9e6dd; --ink-hit:#ff6b5e; --ink-blue:#6fa8ff;
    --paper:#20211d; --surface:#26271f; --line:#3a3b33; --line-strong:#54554a;
    --field:#4bbd7a; --field-soft:#243026; --text:#e9e6dd; --muted:#9a9a90; --shadow:rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
    background:var(--field-soft);
    color:var(--text);
    -webkit-text-size-adjust:100%;
    line-height:1.4;
  }
  button{font-family:inherit;color:inherit;cursor:pointer;}

  /* ---- top bar ---- */
  header.bar{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
    display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
    padding:.5rem .75rem;background:var(--field);color:#fff;
    box-shadow:0 2px 6px var(--shadow);
  }
  header.bar .title{font-weight:700;font-size:1rem;letter-spacing:.02em;}
  header.bar .meta{font-size:.78rem;opacity:.92;}
  header.bar .hdr-actions{
    display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;justify-content:flex-end;
    margin-left:auto;
  }
  header.bar button{
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);
    color:#fff;border-radius:8px;padding:.35rem .6rem;font-size:.8rem;
  }
  header.bar button:hover{background:rgba(255,255,255,.28);}
  header.bar button.hamburger{
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.22rem;
    width:2.3rem;height:2.1rem;padding:0;
  }
  header.bar button.hamburger span{display:block;width:1.15rem;height:2px;background:#fff;border-radius:1px;}
  .save-state{font-size:.72rem;opacity:.85;min-width:4.5rem;text-align:right;}

  /* ---- team tabs ---- */
  .tabs{display:flex;gap:.25rem;padding:.4rem .75rem 0;background:var(--field-soft);}
  .tabs button{
    border:1px solid var(--line-strong);border-bottom:none;
    background:var(--surface);color:var(--muted);
    border-radius:10px 10px 0 0;padding:.4rem .9rem;font-size:.85rem;font-weight:600;
  }
  .tabs button[aria-selected="true"]{background:var(--paper);color:var(--text);box-shadow:0 -2px 4px var(--shadow);}

  /* ---- sheet ---- */
  .sheet-wrap{
    background:var(--paper);
    margin:0 .5rem .5rem;border:1px solid var(--line-strong);border-radius:0 0 10px 10px;
    overflow:auto;-webkit-overflow-scrolling:touch;
    max-height:calc(100dvh - 8.5rem);
  }
  table.sheet{border-collapse:collapse;background:var(--paper);}
  table.sheet th,table.sheet td{border:1px solid var(--line);padding:0;}
  table.sheet thead th{
    position:sticky;top:0;z-index:5;background:var(--field-soft);
    font-size:.72rem;color:var(--muted);font-weight:600;height:2rem;
  }
  .col-order{position:sticky;left:0;z-index:6;background:var(--field-soft);
    min-width:6.7rem;max-width:6.7rem;}
  thead .col-order{z-index:8;}
  .runcol{min-width:2rem;}
  .lineup-cell{
    display:flex;align-items:stretch;gap:.3rem;padding:.25rem .3rem;text-align:left;
    background:transparent;border:none;width:100%;height:100%;
  }
  .lineup-cell .ord{font-weight:700;color:var(--field);font-size:.95rem;width:1rem;text-align:center;align-self:center;}
  .lineup-cell .who{flex:1;min-width:0;}
  .lineup-cell .who .nm{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lineup-cell .who .nm.sub{color:var(--muted);font-weight:500;font-size:.74rem;}
  .lineup-cell .who .pos{font-size:.68rem;color:var(--muted);}
  .lineup-cell .who .empty{font-size:.76rem;color:var(--muted);}

  td.pa{width:7.2rem;height:5.6rem;vertical-align:top;}
  td.pa button.cellbtn{display:block;width:100%;height:100%;background:transparent;border:none;padding:0;}
  td.pa svg{display:block;width:100%;height:100%;}
  tr:nth-child(even) .col-order{background:var(--field-soft);}

  tfoot td{font-size:.8rem;font-weight:700;text-align:center;background:var(--field-soft);height:1.9rem;}
  tfoot td.lbl{position:sticky;left:0;z-index:6;text-align:right;padding-right:.5rem;color:var(--muted);}

  .hint{padding:.4rem .9rem .8rem;color:var(--muted);font-size:.76rem;}

  /* ---- modal ---- */
  .modal-back{position:fixed;inset:0;background:rgba(20,20,15,.5);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;}
  @media(min-width:600px){.modal-back{align-items:center;}}
  .modal{
    background:var(--surface);width:100%;max-width:640px;max-height:90dvh;overflow:auto;
    border-radius:16px 16px 0 0;box-shadow:0 -4px 24px var(--shadow);
    padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom,0px));
  }
  @media(min-width:600px){.modal{border-radius:16px;}}
  .modal h2{margin:.1rem 0 .2rem;font-size:1.05rem;}
  .modal .sub{color:var(--muted);font-size:.8rem;margin-bottom:.7rem;}
  .field{margin-bottom:.6rem;min-width:0;}
  .field label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:.2rem;}
  .field input,.field select{
    width:100%;min-width:0;padding:.5rem;border:1px solid var(--line-strong);border-radius:8px;
    background:var(--paper);color:var(--text);font-size:.9rem;
  }
  .field input[type="date"]{-webkit-appearance:none;appearance:none;}
  .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.5rem;}
  .row3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:.5rem;}

  .chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0 .6rem;}
  .chip{
    border:1.5px solid var(--line-strong);background:var(--paper);color:var(--text);
    border-radius:999px;padding:.5rem .85rem;font-size:.88rem;font-weight:600;
  }
  .chip:hover{border-color:var(--field);}
  .chip[aria-pressed="true"]{background:var(--field);color:#fff;border-color:var(--field);}
  .chip.num{min-width:2.6rem;text-align:center;padding:.5rem 0;}
  .grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;max-width:15rem;}
  .step-title{font-size:.82rem;color:var(--muted);margin:.7rem 0 .25rem;font-weight:700;}

  .pitch-bar{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin:.2rem 0 .4rem;}
  .pitch-bar .seq{flex:1;min-width:6rem;font-size:1rem;letter-spacing:.15em;color:var(--ink);min-height:1.5rem;
    border:1px dashed var(--line-strong);border-radius:8px;padding:.2rem .4rem;background:var(--paper);}
  .mini{border:1px solid var(--line-strong);background:var(--paper);border-radius:8px;padding:.35rem .55rem;font-size:.8rem;}

  .preview{border:1px solid var(--line-strong);border-radius:10px;background:var(--paper);
    padding:.4rem;display:flex;gap:.6rem;align-items:center;margin:.5rem 0;}
  .preview svg{width:120px;height:96px;flex:none;border:1px solid var(--line);border-radius:6px;background:var(--paper);}
  .preview .desc{font-size:.82rem;color:var(--muted);}

  .modal-actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem;align-items:center;}
  .modal-actions .spacer{flex:1;}
  .btn{border-radius:10px;padding:.6rem 1rem;font-size:.9rem;font-weight:700;border:1px solid var(--line-strong);background:var(--paper);}
  .btn.primary{background:var(--field);border-color:var(--field);color:#fff;}
  .btn.ghost{background:transparent;}
  .btn.danger{color:var(--ink-hit);border-color:var(--ink-hit);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .checkline{display:flex;gap:1rem;align-items:center;margin:.3rem 0;font-size:.9rem;}
  .checkline label{display:flex;gap:.35rem;align-items:center;}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;}
  .stepper button{width:2rem;height:2rem;background:var(--paper);border:none;font-size:1.1rem;}
  .stepper span{min-width:1.8rem;text-align:center;font-weight:700;}

  /* players editor */
  .plist{display:flex;flex-direction:column;gap:.35rem;}
  .prow{display:grid;grid-template-columns:1.4rem 3.2rem 1fr 2.6rem 2.4rem;gap:.35rem;align-items:center;}
  .prow .o{font-weight:700;color:var(--field);text-align:center;}
  .prow input,.prow select{padding:.35rem;font-size:.82rem;border:1px solid var(--line-strong);border-radius:6px;background:var(--paper);color:var(--text);}

  /* header menu */
  .menu-list{display:flex;flex-direction:column;gap:.5rem;margin:.4rem 0;}
  .menu-list .btn{width:100%;text-align:center;}
  .ver{font-size:.72rem;font-weight:400;color:var(--muted);}

  /* history list */
  .hist-list{display:flex;flex-direction:column;max-height:60vh;overflow:auto;}
  .hist-row{display:flex;align-items:center;gap:.5rem;padding:.55rem 0;border-bottom:1px solid var(--line);}
  .hist-row:last-child{border-bottom:none;}
  .hist-row .info{flex:1;min-width:0;}
  .hist-row .info .vs{font-weight:700;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hist-row .info .sub2{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hist-row .now-badge{color:var(--field);font-weight:700;}

  /* ---- live view ---- */
  #liveView{padding:.5rem .6rem 1.2rem;}
  .scoreboard{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;margin-bottom:.6rem;}
  .scoreboard table{border-collapse:collapse;width:100%;font-size:.8rem;}
  .scoreboard th,.scoreboard td{border:1px solid var(--line);padding:.28rem .45rem;text-align:center;min-width:1.5rem;}
  .scoreboard th{background:var(--field-soft);color:var(--muted);font-weight:600;}
  .scoreboard td.team{text-align:left;white-space:nowrap;font-weight:700;min-width:5rem;position:sticky;left:0;background:var(--surface);}
  .scoreboard .rhe{font-weight:800;background:var(--field-soft);}
  .scoreboard tr.batting td.team{color:var(--field);}
  .scoreboard th.now,.scoreboard td.now{background:var(--field-soft);}

  .statusbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:.5rem .7rem;margin-bottom:.6rem;}
  .statusbar .inn{font-weight:800;color:var(--field);font-size:1.05rem;}
  .statusbar .bat{font-size:.92rem;}
  .batbtn{background:transparent;border:1px solid var(--line-strong);border-radius:8px;padding:.2rem .5rem;font:inherit;color:inherit;}
  .batbtn:active{background:var(--field-soft);}
  .statusbar .bat .o{font-weight:800;color:var(--field);}
  .count{display:flex;gap:.9rem;margin-left:auto;align-items:center;}
  .count .grp{display:flex;align-items:center;gap:.28rem;font-size:.8rem;color:var(--muted);font-weight:700;}
  .dot{width:.72rem;height:.72rem;border-radius:50%;border:1.5px solid var(--line-strong);display:inline-block;}
  .dot.b{border-color:#2a9d3a;} .dot.b.on{background:#2a9d3a;}
  .dot.s{border-color:#e0a000;} .dot.s.on{background:#e0a000;}
  .dot.o{border-color:var(--ink-hit);} .dot.o.on{background:var(--ink-hit);}

  .field-wrap{display:flex;gap:.9rem;flex-wrap:wrap;align-items:flex-start;}
  .diamond{position:relative;width:220px;height:190px;flex:none;margin:0 auto;}
  .diamond svg{position:absolute;inset:0;width:100%;height:100%;}
  .basebtn{position:absolute;width:46px;height:46px;transform:translate(-50%,-50%) rotate(45deg);
    border:2px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:0;display:flex;align-items:center;justify-content:center;}
  .basebtn.occ{background:var(--field);border-color:var(--field);box-shadow:0 2px 6px var(--shadow);}
  .basebtn span{transform:rotate(-45deg);font-weight:800;font-size:.95rem;color:var(--muted);}
  .basebtn.occ span{color:#fff;}
  .atbat{flex:1;min-width:15rem;}
  .ctrl-title{font-size:.76rem;color:var(--muted);font-weight:700;margin:.35rem 0 .3rem;}
  .pitchrow,.resrow{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.35rem;}
  .pitchrow button,.resrow button{border:1.5px solid var(--line-strong);background:var(--paper);color:var(--text);border-radius:10px;padding:.6rem .85rem;font-size:.92rem;font-weight:700;}
  .pitchrow button:active,.resrow button:active{background:var(--field-soft);}
  .resrow button.hit{border-color:var(--ink-hit);color:var(--ink-hit);}
  .livebar{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem;}
  .change{background:var(--field);color:#fff;border-color:var(--field);}
  .overbar{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;background:#c0392b;color:#fff;border-radius:10px;padding:.6rem .8rem;margin-bottom:.6rem;font-weight:800;}
  .overbar .btn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);color:#fff;font-weight:700;}
  .legend{font-size:.72rem;color:var(--text);line-height:1.6;padding:.55rem .7rem;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);margin:.1rem .5rem .3rem;}
  .legend b{color:var(--field);}

  @media print{
    header.bar,.tabs,.hint,.toolbar-print{display:none!important;}
    body{background:#fff;}
    .sheet-wrap{max-height:none;overflow:visible;border:none;margin:0;}
    table.sheet{width:100%;}
    .print-title{display:block!important;}
  }
  .print-title{display:none;padding:.4rem .75rem;font-weight:700;}
</style>
</head>
<body>

<header class="bar">
  <span class="title">スコアブック</span>
  <span class="meta" id="metaLine">—</span>
  <div class="hdr-actions">
    <span class="save-state" id="saveState"></span>
    <button id="btnView">表を見る</button>
    <button id="btnMenu" class="hamburger" aria-label="メニュー" title="メニュー"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="print-title" id="printTitle"></div>

<div id="liveView"></div>
<div id="gridView" style="display:none">
  <nav class="tabs" id="teamTabs" role="tablist"></nav>
  <div class="sheet-wrap"><div id="sheet"></div></div>
  <div id="legend"></div>
  <p class="hint">マスをタップして打席を記録します。打順の欄をタップすると選手の編集・交代ができます。記録は自動でこの端末に保存されます。</p>
</div>

<script>
"use strict";

/* ---------------- constants ---------------- */
const POS = ["投","捕","一","二","三","遊","左","中","右","指"];
const POS_NUM = {"投":1,"捕":2,"一":3,"二":4,"三":5,"遊":6,"左":7,"中":8,"右":9,"指":"D"};
const BATS = ["右","左","両"];
const ROMAN = {1:"Ⅰ",2:"Ⅱ",3:"Ⅲ"};
const PITCH = { // ball-count marks
  called:{g:"×",label:"見逃し"},
  swing:{g:"⊗",label:"空振り"},
  ball:{g:"●",label:"ボール"},
  foul:{g:"△",label:"ファウル"},
};
const APP_VERSION = "1.3.0";
const STORAGE_KEY = "scorebook.v1";
const ROSTER_KEY = "scorebook.roster.v1";
const HISTORY_KEY = "scorebook.history.v1";
const HISTORY_MAX = 300;
let ROSTER=[]; let ROSTER_TEAM="";
let HISTORY=[];
function loadHistory(){ try{ const raw=localStorage.getItem(HISTORY_KEY); const d=raw?JSON.parse(raw):[]; HISTORY=Array.isArray(d)?d:[]; }catch(e){ HISTORY=[]; } }
function saveHistory(){ try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(HISTORY)); }catch(e){} }
function loadRoster(){ try{ const raw=localStorage.getItem(ROSTER_KEY); const d=raw?JSON.parse(raw):null;
  if(Array.isArray(d)){ ROSTER=d; ROSTER_TEAM=""; }
  else if(d&&typeof d==="object"){ ROSTER=d.players||[]; ROSTER_TEAM=d.name||""; }
  else { ROSTER=[]; ROSTER_TEAM=""; }
}catch(e){ ROSTER=[]; ROSTER_TEAM=""; } }
function saveRoster(){ try{ localStorage.setItem(ROSTER_KEY, JSON.stringify({name:ROSTER_TEAM, players:ROSTER})); }catch(e){} }
function applySavedTeam(){ if(ROSTER_TEAM){ S.teams.home.name=ROSTER_TEAM; S.meta.home=ROSTER_TEAM; } }

/* ---------------- state ---------------- */
let S = null;

function blankPlayer(order){return {order, pos:"", name:"", num:"", bats:"右", sub:false};}
function blankTeam(name){
  const players=[]; for(let o=1;o<=9;o++) players.push(blankPlayer(o));
  return {name, players, subs:[], pitchers:[], cells:{}};
}
function newGame(){
  return {
    meta:{date:today(), tourney:"", home:"自チーム", away:"相手チーム", ground:""},
    innings:9,
    active:"home",
    view:"live",
    live:{ inning:1, half:"top", pitches:[], order:{home:1, away:1} },
    pre:{ runs:{away:{},home:{}}, hits:{away:0,home:0}, outs:{away:{},home:{}} },
    teams:{ home:blankTeam("自チーム"), away:blankTeam("相手チーム") }
  };
}
function migrate(){
  if(!S.view) S.view="live";
  if(!S.live) S.live={inning:1,half:"top",pitches:[],order:{home:1,away:1}};
  if(!S.live.pitches) S.live.pitches=[];
  if(!S.live.order) S.live.order={home:1,away:1};
  if(!S.pre) S.pre={runs:{away:{},home:{}},hits:{away:0,home:0},outs:{away:{},home:{}}};
  if(!S.pre.runs) S.pre.runs={away:{},home:{}};
  if(!S.pre.hits) S.pre.hits={away:0,home:0};
  if(!S.pre.outs) S.pre.outs={away:{},home:{}};
  ["home","away"].forEach(k=>{ if(!S.teams[k].subs) S.teams[k].subs=[]; if(!S.teams[k].pitchers) S.teams[k].pitchers=[]; const cs=S.teams[k].cells||{}; for(const key in cs){ if(cs[key] && !Array.isArray(cs[key])) cs[key]=[cs[key]]; (cs[key]||[]).forEach(pa=>{ if(pa && pa.advances) pa.advances.forEach(a=>{ if(a.toBase>4){ a.toBase=4; pa.run=true; } }); }); } });
}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}

/* ---------------- persistence ---------------- */
let saveTimer=null;
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); flashSaved(); archiveCurrentGame(); }
  catch(e){ document.getElementById("saveState").textContent="保存不可"; }
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(save,400); }
function flashSaved(){ const el=document.getElementById("saveState"); el.textContent="保存済み"; setTimeout(()=>{if(el.textContent==="保存済み")el.textContent="";},1500); }
function load(){
  try{ const raw=localStorage.getItem(STORAGE_KEY); if(raw){ S=JSON.parse(raw); return true; } }
  catch(e){}
  return false;
}

/* ---------------- game history (past games) ---------------- */
function finalScoreOf(g){
  const res={};
  ["home","away"].forEach(k=>{
    const tm=g.teams[k]; let r=0;
    for(let n=1;n<=g.innings;n++){ r+=liveRuns(tm,n)+((g.pre.runs[k]&&g.pre.runs[k][n])||0); }
    res[k]=r;
  });
  return res;
}
function isBlankGame(g){
  const noCells=["home","away"].every(k=>!g.teams[k].cells||!Object.keys(g.teams[k].cells).length);
  const noPitches=!(g.live&&g.live.pitches&&g.live.pitches.length);
  const noPre=!g.pre||(!Object.keys(g.pre.runs.home||{}).length&&!Object.keys(g.pre.runs.away||{}).length&&!g.pre.hits.home&&!g.pre.hits.away);
  return noCells&&noPitches&&noPre;
}
function archiveCurrentGame(){
  if(!S||isBlankGame(S)) return;
  if(!S.__histId) S.__histId=Date.now()+"-"+Math.random().toString(36).slice(2);
  const entry={ id:S.__histId, savedAt:new Date().toISOString(), meta:{...S.meta}, score:finalScoreOf(S), game:JSON.parse(JSON.stringify(S)) };
  const idx=HISTORY.findIndex(h=>h.id===entry.id);
  if(idx>=0) HISTORY[idx]=entry; else HISTORY.unshift(entry);
  if(HISTORY.length>HISTORY_MAX) HISTORY.length=HISTORY_MAX;
  saveHistory();
}
function openHistory(){
  loadHistory();
  const list=HISTORY.slice().sort((a,b)=>(b.savedAt||"").localeCompare(a.savedAt||""));
  let rows=list.map(h=>{
    const isCurrent=S&&S.__histId===h.id;
    const title=[h.meta.date,h.meta.tourney].filter(Boolean).join("　");
    return `<div class="hist-row">
      <div class="info">
        <div class="vs">${esc(h.meta.away)} ${h.score.away} - ${h.score.home} ${esc(h.meta.home)}${isCurrent?'<span class="now-badge"> ・編集中</span>':''}</div>
        <div class="sub2">${esc(title)}${h.meta.ground?("　"+esc(h.meta.ground)):""}</div>
      </div>
      <button class="btn" data-histopen="${esc(h.id)}" ${isCurrent?"disabled":""}>開く</button>
      <button class="btn ghost" data-histdel="${esc(h.id)}">削除</button>
    </div>`;
  }).join("");
  if(!list.length) rows=`<div class="sub">まだ試合の記録がありません。</div>`;
  showModal(`<h2>過去の試合</h2><div class="sub">「開く」を押すとその試合を編集・表示・PDF出力できます。</div><div class="hist-list">${rows}</div><div class="modal-actions"><span class="spacer"></span><button class="btn ghost" id="hClose">閉じる</button></div>`);
  document.getElementById("hClose").onclick=closeModal;
  document.querySelectorAll("[data-histopen]").forEach(b=>b.onclick=()=>openHistoryGame(b.dataset.histopen));
  document.querySelectorAll("[data-histdel]").forEach(b=>b.onclick=()=>confirmDeleteHistory(b.dataset.histdel));
}
function openHistoryGame(id){
  const entry=HISTORY.find(h=>h.id===id);
  if(!entry) return;
  archiveCurrentGame();
  S=JSON.parse(JSON.stringify(entry.game));
  S.__histId=entry.id;
  migrate();
  save(); closeModal(); renderAll();
}
function confirmDeleteHistory(id){
  showModal(`<h2>この試合を削除しますか？</h2><div class="sub">この操作は取り消せません。</div>
    <div class="modal-actions"><span class="spacer"></span><button class="btn ghost" id="hdCancel">キャンセル</button><button class="btn danger" id="hdOk">削除する</button></div>`);
  document.getElementById("hdCancel").onclick=openHistory;
  document.getElementById("hdOk").onclick=()=>{ HISTORY=HISTORY.filter(h=>h.id!==id); saveHistory(); openHistory(); };
}

/* ---------------- helpers ---------------- */
function team(){ return S.teams[S.active]; }
function cellKey(o,i){ return o+"_"+i; }
// a cell holds an array of plate appearances (PAs); latest = current for base/push logic
function paList(tm,o,i){ const v=tm.cells[cellKey(o,i)]; if(!v) return []; return Array.isArray(v)?v:[v]; }
function paLast(tm,o,i){ const l=paList(tm,o,i); return l.length?l[l.length-1]:null; }
function paCount(tm,o,i){ return paList(tm,o,i).length; }
function paPush(tm,o,i,pa){ const k=cellKey(o,i); const v=tm.cells[k]; if(!v) tm.cells[k]=[pa]; else if(Array.isArray(v)) v.push(pa); else tm.cells[k]=[v,pa]; }
function paSetLast(tm,o,i,pa){ const k=cellKey(o,i); const l=paList(tm,o,i); if(!l.length){ tm.cells[k]=[pa]; return; } l[l.length-1]=pa; tm.cells[k]=l; }
function paPopLast(tm,o,i){ const k=cellKey(o,i); const l=paList(tm,o,i); l.pop(); if(l.length) tm.cells[k]=l; else delete tm.cells[k]; }
function battingSide(){ return S.live.half==="top" ? "away" : "home"; }
function fieldingSide(){ return S.live.half==="top" ? "home" : "away"; }
function currentPlayer(t,o){ const subs=(t.subs||[]).filter(p=>p.order===o); return subs.length?subs[subs.length-1]:t.players[o-1]; }
function currentPitcher(k){ const ps=S.teams[k].pitchers||[]; return ps.length?ps[ps.length-1]:null; }
function totalRuns(k){ let r=0; for(let n=1;n<=S.innings;n++){ r+=liveRuns(S.teams[k],n)+((S.pre.runs[k]&&S.pre.runs[k][n])||0); } return r; }
function liveTeam(){ return S.teams[battingSide()]; }
function liveOrder(){ return S.live.order[battingSide()]; }
function tmHasCell(tm,n){ for(let o=1;o<=9;o++){ if(tm.cells[cellKey(o,n)]) return true; } return false; }
function liveRuns(tm,n){ let r=0; for(let o=1;o<=9;o++){ paList(tm,o,n).forEach(c=>{ if(c.run) r++; }); } return r; }
function liveHits(tm,n){ let x=0; for(let o=1;o<=9;o++){ paList(tm,o,n).forEach(c=>{ if(c.category==="hit") x++; }); } return x; }
function teamOuts(tm,i){ const k=tm===S.teams.home?"home":"away"; let n=(S.pre&&S.pre.outs&&S.pre.outs[k]&&S.pre.outs[k][i])||0; for(let o=1;o<=9;o++){ paList(tm,o,i).forEach(c=>{ if(c.outNumber) n++; if(c.advances) c.advances.forEach(a=>{ if(a.out) n++; }); }); } return Math.min(n,3); }
function onBaseRunnersT(tm,i,exclude){
  const res=[];
  for(let oo=1;oo<=9;oo++){ if(oo===exclude) continue;
    const c=paLast(tm,oo,i); if(!c || !(c.reachedBase>=1)) continue;
    if(c.advances && c.advances.length && c.advances[c.advances.length-1].out) continue;
    const fin=finalBaseOf(c);
    if(fin>=1 && fin<=3){ res.push({order:oo, base:fin, name:(currentPlayer(tm,oo)&&currentPlayer(tm,oo).name)||""}); }
  }
  return res;
}
function countBS(){
  let b=0,s=0;
  S.live.pitches.forEach(p=>{ if(p==="ball")b++; else if(p==="called"||p==="swing")s++; else if(p==="foul"){ if(s<2)s++; } });
  return {b:Math.min(b,4), s:Math.min(s,3)};
}
function advanceRunnerCell(tm,order,i,reason,dur){
  const c=paLast(tm,order,i); if(!c) return;
  const cur=c.advances&&c.advances.length?c.advances[c.advances.length-1].toBase:c.reachedBase;
  if(cur>=4) return;
  c.advances=c.advances||[];
  c.advances.push({toBase:cur+1, reason, duringOrder:dur});
  if(cur+1===4) c.run=true;
}
function homeRunnerCell(tm,order,i,reason,dur){
  const c=paLast(tm,order,i); if(!c) return;
  const cur=c.advances&&c.advances.length?c.advances[c.advances.length-1].toBase:c.reachedBase;
  if(cur>=4) return;
  c.advances=c.advances||[];
  c.advances.push({toBase:4, reason, duringOrder:dur});
  c.run=true;
}
function outRunnerCell(tm,order,i,dur,note){
  const c=paLast(tm,order,i); if(!c) return;
  const cur=c.advances&&c.advances.length?c.advances[c.advances.length-1].toBase:c.reachedBase;
  c.advances=c.advances||[];
  c.advances.push({toBase:cur, reason:note||"×", out:true, duringOrder:dur});
}
function pushRunnerTo(tm,order,i,target,reason,dur){
  const c=paLast(tm,order,i); if(!c) return;
  const cur=finalBaseOf(c);
  if(target<=cur) return;
  c.advances=c.advances||[];
  c.advances.push({toBase:target, reason, duringOrder:dur});
  if(target>=4) c.run=true;
}
// batter reaches base B -> push every runner that would overlap or be passed, minimally, forward only
function pushRunnersFor(tm,i,B,batterOrder){
  const runners=onBaseRunnersT(tm,i,batterOrder).sort((a,b)=>a.base-b.base);
  let need=B+1;
  runners.forEach(r=>{ const a=Math.min(4, Math.max(need, r.base)); if(a>r.base){ pushRunnerTo(tm,r.order,i,a,"押",batterOrder); } need=a+1; });
}
function nextOrder(o){ return (o%9)+1; }
function finalBaseOf(c){ return c && c.advances && c.advances.length ? c.advances[c.advances.length-1].toBase : (c?c.reachedBase:0); }
function onBaseRunners(i, exclude){ return onBaseRunnersT(team(), i, exclude); }
function outsInInning(t,i){ let n=0; for(let o=1;o<=9;o++){ paList(t,o,i).forEach(c=>{ if(c.outNumber) n++; }); } return n; }

function runsInInning(t,i){

function hitsInInning(t,i){

/* ---------------- cell SVG (auto-draw) ---------------- */
// square diamond: HOME bottom-left, 1B bottom-right, 2B top-right, 3B top-left
const D = { HOME:[32,82], B1:[110,82], B2:[110,18], B3:[32,18] };
const PATH_ORDER = [D.HOME, D.B1, D.B2, D.B3, D.HOME]; // home->1->2->3->home
function cellStackSVG(pas,o,i){
  if(!pas || !pas.length) return cellSVG(null,o,i);
  if(pas.length===1) return cellSVG(pas[0],o,i);
  return `<div style="display:flex;flex-direction:column;height:100%">`+
    pas.map((pa,idx)=>`<div style="flex:1;min-height:0;${idx?'border-top:1px dashed var(--line-strong);':''}">${cellSVG(pa, idx===pas.length-1?o:0, idx===pas.length-1?i:0)}</div>`).join("")+
    `</div>`;
}
function cellSVG(c,o,i){
  let s=`<svg viewBox="0 0 120 96" xmlns="http://www.w3.org/2000/svg">`;
  // faint diamond outline
  s+=`<polygon points="${D.HOME.join(",")} ${D.B1.join(",")} ${D.B2.join(",")} ${D.B3.join(",")}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  // ball-count column: pitches (need c), then advance-timing checks (cross-cell; shown even on an empty cell)
  {
    let y=12;
    if(c) (c.pitches||[]).slice(0,7).forEach(p=>{
      s+=`<text x="10" y="${y}" font-size="9" fill="var(--ink)" text-anchor="middle" dominant-baseline="middle">${PITCH[p]?PITCH[p].g:""}</text>`;
      y+=11;
    });
    if(o && i){
      const t=team(); let checks=0;
      for(let oo=1;oo<=9;oo++){ paList(t,oo,i).forEach(cc=>{ if(cc.advances) cc.advances.forEach(a=>{ if(a.duringOrder===o) checks++; }); }); }
      for(let k=0;k<checks && y<=92;k++){ s+=`<text x="10" y="${y}" font-size="9" fill="var(--ink-blue)" text-anchor="middle" dominant-baseline="middle">✓</text>`; y+=11; }
    }
  }
  if(!c){ return s+`</svg>`; }
  const col = c.color==="hit"?"var(--ink-hit)":c.color==="blue"?"var(--ink-blue)":"var(--ink)";
  // scored -> fill diamond softly
  if(c.run){
    s+=`<polygon points="${D.HOME.join(",")} ${D.B1.join(",")} ${D.B2.join(",")} ${D.B3.join(",")}" fill="var(--ink-hit)" fill-opacity="0.10" stroke="none"/>`;
  }
  // runner path along square edges up to reachedBase (hits get a drawn line; non-hit reaches: light)
  if(c.reachedBase>0){
    const pts=PATH_ORDER.slice(0, Math.min(c.reachedBase,4)+1);
    const dash = c.color==="hit" ? "" : `stroke-dasharray="3 3"`;
    s+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${col}" stroke-width="2.4" ${dash} stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  // runner advancement overlay (does not replace the batting result)
  if(c.advances && c.advances.length){
    const finalB=Math.min(4, c.advances[c.advances.length-1].toBase);
    const seg=[]; for(let b=c.reachedBase;b<=finalB;b++){ if(PATH_ORDER[b]) seg.push(PATH_ORDER[b]); }
    if(seg.length>1) s+=`<polyline points="${seg.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>`;
    c.advances.forEach(a=>{ const tb=Math.min(4,a.toBase); const bp=PATH_ORDER[tb]; if(!bp) return; const nx=bp[0]+(71-bp[0])*0.22, ny=bp[1]+(50-bp[1])*0.22;
      s+=`<text x="${nx}" y="${ny}" font-size="9" fill="var(--ink)" text-anchor="middle" dominant-baseline="middle">${esc(a.reason)}</text>`; });
  }
  // batting result text near 1B (right-lower)
  if(c.resultText){
    // sacrifice marks
    if(c.sacBunt){ s+=`<rect x="60" y="60" width="44" height="22" rx="3" fill="none" stroke="var(--ink-blue)" stroke-width="1.5"/>`; }
    if(c.sacFly){ s+=`<polygon points="82,58 62,84 102,84" fill="none" stroke="var(--ink-blue)" stroke-width="1.5"/>`; }
    const qmark = c.quality==="fly"?"⌒":c.quality==="liner"?"−":"";
    if(qmark){ s+=`<text x="82" y="60" font-size="12" fill="${col}" text-anchor="middle">${qmark}</text>`; }
    s+=`<text x="82" y="76" font-size="17" font-weight="700" fill="${col}" text-anchor="middle" dominant-baseline="middle">${esc(c.resultText)}</text>`;
  }
  // out count (center)
  if(c.outNumber){
    s+=`<text x="63" y="46" font-size="20" font-weight="700" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">${ROMAN[c.outNumber]||""}</text>`;
  }
  // rbi (batter order circled) — small marker top-left of diamond
  if(c.rbi>0){
    s+=`<circle cx="46" cy="30" r="8" fill="none" stroke="var(--ink-hit)" stroke-width="1.4"/>`;
    s+=`<text x="46" y="30" font-size="9" fill="var(--ink-hit)" text-anchor="middle" dominant-baseline="middle">打${c.rbi}</text>`;
  }
  return s+`</svg>`;
}

  const t=team();
  const existing = (S.view==="live") ? null : paLast(t,o,i);
  W={ o,i,
      category:null, reachedBase:0, outNumber:null, color:"black",
      resultText:"", quality:null, sacBunt:false, sacFly:false,
      fielders:[], advances:[], run:false, rbi:0, pitches: existing?[...(existing.pitches||[])]:[] };
  if(existing){ Object.assign(W, JSON.parse(JSON.stringify(existing)), {o,i}); }
  if(S.view==="live"){ W.pitches=[...S.live.pitches]; }

    W.category=preset; W.reachedBase=0; W.outNumber=null; W.resultText=""; W.quality=null;
    W.sacBunt=false; W.sacFly=false; W.fielders=[]; W.advances=[]; W._ot=null; W._touchBase=null;

        const t2=team(); const last=W.advances[W.advances.length-1];
        const orders=[]; for(let oo=1;oo<=9;oo++){ if(t2.cells[cellKey(oo,W.i)]) orders.push(oo); }
        h+=`<div class="chips" id="wDuring"><span style="align-self:center;font-size:.78rem;color:var(--muted)">上の進塁が起きたときの打者（その打者にチェックが付きます）：</span>`;
        orders.forEach(oo=> h+=`<button class="chip num" data-during="${oo}" aria-pressed="${last.duringOrder===oo}">${oo}番</button>`);
        h+=`<button class="chip" data-during="0" aria-pressed="${!last.duringOrder}">なし</button></div>`;
      }
    }
    const runners = onBaseRunners(W.i, W.o);
    if(runners.length){
      h+=`<div class="step-title">塁上の他の走者を動かす</div>`;
      runners.forEach(r=>{
        const baseL={1:"一塁",2:"二塁",3:"三塁"}[r.base];
        const nextL={1:"二塁",2:"三塁",3:"本塁"}[r.base];
        h+=`<div class="chips"><span class="chip" style="border-style:dashed">${r.order}番 ${esc(r.name)}（${baseL}）→ ${nextL}</span>`;
        [["S","盗塁"],["W","暴投"],["P","捕逸"],["BK","ボーク"],["打","打者進塁"],["進","その他"]].forEach(([rs,l])=>
          h+=`<button class="chip" data-move="${r.order}" data-movereason="${rs}">${l}</button>`);
        h+=`</div>`;
      });
      h+=`<div class="hint" style="padding:.1rem 0">選ぶと走者は1つ先の塁へ進み、今の打者のカウント欄に✓が付きます。</div>`;
    }
  }

  // preview — only in the grid editor (in live, scoring is done on the diamond after confirm)
  if(S.view!=="live"){
    h+=`<div class="preview"><div>${cellSVG(previewCell())}</div><div class="desc" id="wDesc">${describe()}</div></div>`;
    h+=`<div style="font-size:.72rem;color:var(--muted);margin:.2rem 0">得点は「出塁後どこまで進んだか」で本塁まで進めると入ります。</div>`;
  }

  if(S.view==="live"){
    h+=`<div class="modal-actions"><span class="spacer"></span>
          <button class="btn ghost" id="wCancel">キャンセル</button>
          <button class="btn primary" id="wOk" ${W.category?"":"disabled"}>確定</button>
        </div>`;
  } else {
    h+=`<div class="modal-actions">
          <button class="btn danger" id="wClear">消す</button>
          <span class="spacer"></span>
          <button class="btn ghost" id="wCancel">キャンセル</button>
          <button class="btn" id="wOk" ${W.category?"":"disabled"}>確定</button>
          <button class="btn primary" id="wOkNext" ${W.category?"":"disabled"}>確定 → 次へ</button>
        </div>`;
  }
  showModal(h);
  bindWizard();
}
function detailHTML(){
  if(!W.category) return `<div class="hint" style="padding:.3rem 0">上から結果の種類を選ぶと、詳細が表示されます。</div>`;
  if(W.category==="hit"){
    let h=`<div class="step-title">安打の種類</div><div class="chips" id="wHit">`;
    [["1","単打"],["2","二塁打"],["3","三塁打"],["4","本塁打"]].forEach(([b,l])=>
      h+=`<button class="chip" data-base="${b}" aria-pressed="${W.reachedBase==b}">${l}</button>`);
    h+=`</div><div class="step-title">打球の質</div><div class="chips" id="wQ">`;
    [["ground","ゴロ"],["liner","ライナー"],["fly","フライ"]].forEach(([q,l])=>
      h+=`<button class="chip" data-q="${q}" aria-pressed="${W.quality===q}">${l}</button>`);
    h+=`</div><div class="step-title">打球方向（守備位置）</div><div class="grid9" id="wDir">`;
    for(let n=1;n<=9;n++) h+=`<button class="chip num" data-dir="${n}" aria-pressed="${W.resultText==String(n)}">${n} ${POS[n-1]}</button>`;
    h+=`</div>`;
    return h;
  }
  if(W.category==="out"){
    let h=`<div class="step-title">アウトの種類・打球</div><div class="chips" id="wOutType">`;
    [["K","三振"],["ground","ゴロ"],["liner","ライナー"],["fly","フライ"],["foulfly","ファウルフライ"],["sacB","犠打"],["sacF","犠飛"]].forEach(([k,l])=>
      h+=`<button class="chip" data-ot="${k}" aria-pressed="${W._ot===k}">${l}</button>`);
    h+=`</div>`;
    if(W._ot && W._ot!=="K"){
      h+=`<div class="step-title">守備の連携（関わった野手を順にタップ）</div><div class="grid9" id="wFld">`;
      for(let n=1;n<=9;n++) h+=`<button class="chip num" data-fld="${n}">${n} ${POS[n-1]}</button>`;
      h+=`</div><div class="chips"><span class="chip" style="border-style:dashed" id="wFldSeq">${outResultText()||"—"}</span>
          <button class="chip" data-fld="undo">←戻す</button></div>`;
      h+=`<div class="step-title" style="margin-top:.3rem">最後の野手が自分でベースを踏んだ場合だけ選ぶ（任意）</div><div class="chips" id="wTouch">`;
      [["1","一塁を踏む"],["2","二塁を踏む"],["3","三塁を踏む"],["4","本塁を踏む"]].forEach(([b,l])=>
        h+=`<button class="chip" data-touch="${b}" aria-pressed="${W._touchBase==b}">${l}</button>`);
      h+=`<button class="chip" data-touch="0" aria-pressed="${!W._touchBase}">踏まない</button></div>`;
    }
    return h;
  }
  if(W.category==="walk"){
    let h=`<div class="step-title">出塁の種類</div><div class="chips" id="wWalk">`;
    [["B","四球"],["HP","死球"],["IB","故意四球"],["IF","打撃妨害"]].forEach(([k,l])=>
      h+=`<button class="chip" data-w="${k}" aria-pressed="${W.resultText===k}">${l}</button>`);
    h+=`</div>`;
    return h;
  }
  if(W.category==="err"){
    let h=`<div class="step-title">失策した野手</div><div class="grid9" id="wErr">`;
    for(let n=1;n<=9;n++) h+=`<button class="chip num" data-err="${n}" aria-pressed="${W.resultText==(n+'E')}">${n} ${POS[n-1]}</button>`;
    h+=`</div><div class="hint" style="padding:.2rem 0">失策で一塁到達として記録します（安打には数えません）。</div>`;
    return h;
  }
  if(W.category==="adv"){
    let h=`<div class="step-title">進塁の理由</div><div class="chips" id="wAdv">`;
    [["S","盗塁"],["W","暴投"],["P","捕逸"],["BK","ボーク"]].forEach(([k,l])=>
      h+=`<button class="chip" data-a="${k}" aria-pressed="${W.resultText===k}">${l}</button>`);
    h+=`</div><div class="step-title">進んだ塁</div><div class="chips" id="wAdvBase">`;
    [["2","二塁"],["3","三塁"],["4","本塁"]].forEach(([b,l])=>
      h+=`<button class="chip" data-ab="${b}" aria-pressed="${W.reachedBase==b}">${l}</button>`);
    h+=`</div>`;
    return h;
  }
  return "";
}
function describe(){
  if(!W.category) return "結果を選んでください。";
  const baseTxt={1:"一塁",2:"二塁",3:"三塁",4:"本塁"}[W.reachedBase]||"";
  if(W.category==="hit") return `安打（${baseTxt}到達）　方向 ${W.resultText||"—"}　${W.quality?({ground:"ゴロ",liner:"ライナー",fly:"フライ"}[W.quality]):""}`;
  if(W.category==="out"){
    const t={K:"三振",ground:"ゴロ",liner:"ライナー",fly:"フライ",foulfly:"ファウルフライ",sacB:"犠打",sacF:"犠飛"}[W._ot]||"";
    return `アウト（${t}）${W.resultText?" "+W.resultText:""}　${W.outNumber?ROMAN[W.outNumber]:""}`;
  }
  if(W.category==="walk") return {B:"四球",HP:"死球",IB:"故意四球",IF:"打撃妨害"}[W.resultText]||"四死球";
  if(W.category==="err") return `失策出塁（${W.resultText||"—"}）`;
  if(W.category==="adv") return `進塁 ${W.resultText||""}（${baseTxt}）`;
  return "";
}
function previewCell(){ return buildCell(); }
function buildCell(){
  const c={ category:W.category, reachedBase:W.reachedBase, outNumber:W.outNumber,
            color:W.color, resultText:W.resultText, quality:W.quality,
            sacBunt:W.sacBunt, sacFly:W.sacFly, fielders:[...W.fielders],
            advances:JSON.parse(JSON.stringify(W.advances||[])),
            run:W.run, rbi:W.rbi, pitches:[...W.pitches] };
  return c;
}
function bindWizard(){
  // pitches
  document.querySelectorAll("[data-pitch]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.pitch;
    if(k==="undo") W.pitches.pop(); else W.pitches.push(k);
    renderWizard();
  });
  // category
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{
    W.category=b.dataset.cat;
    // reset details
    W.reachedBase=0; W.outNumber=null; W.resultText=""; W.quality=null;
    W.sacBunt=false; W.sacFly=false; W.fielders=[]; W.advances=[]; W._ot=null; W._touchBase=null;
    W.color = W.category==="hit"?"hit":W.category==="walk"?"blue":"black";
    renderWizard();
  });
  // hit
  document.querySelectorAll("[data-base]").forEach(b=>b.onclick=()=>{ W.reachedBase=+b.dataset.base; if(W.reachedBase===4)W.run=true; renderWizard(); });
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{ W.quality=b.dataset.q; renderWizard(); });
  document.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>{ W.resultText=b.dataset.dir; renderWizard(); });
  // out
  document.querySelectorAll("[data-ot]").forEach(b=>b.onclick=()=>{
    W._ot=b.dataset.ot; W.fielders=[]; W._touchBase=null; W.sacBunt=(W._ot==="sacB"); W.sacFly=(W._ot==="sacF");
    W.color="black"; if(W._ot==="sacB"||W._ot==="sacF") W.color="blue";
    W.quality = (W._ot==="fly"||W._ot==="foulfly")?"fly":(W._ot==="liner")?"liner":null;
    if(W._ot==="K"){ W.resultText="K"; }
    else W.resultText="";
    W.reachedBase=0;
    autoOut();
    renderWizard();
  });
  document.querySelectorAll("[data-fld]").forEach(b=>b.onclick=()=>{
    const v=b.dataset.fld;
    if(v==="undo") W.fielders.pop(); else W.fielders.push(+v);
    W.resultText = outResultText();
    renderWizard();
  });
  document.querySelectorAll("[data-touch]").forEach(b=>b.onclick=()=>{
    W._touchBase = (+b.dataset.touch)||null;
    W.resultText = outResultText();
    renderWizard();
  });
  // walk
  document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{ W.resultText=b.dataset.w; W.reachedBase=1; W.color="blue"; renderWizard(); });
  // error
  document.querySelectorAll("[data-err]").forEach(b=>b.onclick=()=>{ W.resultText=b.dataset.err+"E"; W.reachedBase=1; W.color="black"; renderWizard(); });
  // runner advancement
  document.querySelectorAll("[data-adv]").forEach(b=>b.onclick=()=>{
    const cur = W.advances.length? W.advances[W.advances.length-1].toBase : W.reachedBase;
    if(cur>=4) return;
    W.advances.push({toBase:cur+1, reason:b.dataset.adv});
    if(cur+1===4) W.run=true;
    renderWizard();
  });
  const au=document.querySelector("[data-advundo]"); if(au) au.onclick=()=>{
    W.advances.pop();
    const fin = W.advances.length? W.advances[W.advances.length-1].toBase : W.reachedBase;
    if(fin!==4) W.run=false;
    renderWizard();
  };
  document.querySelectorAll("[data-during]").forEach(b=>b.onclick=()=>{
    if(!W.advances.length) return;
    const v=+b.dataset.during;
    W.advances[W.advances.length-1].duringOrder = v||null;
    renderWizard();
  });
  // move a runner already on base (writes to that runner's cell; ✓ derives onto this batter)
  document.querySelectorAll("[data-move]").forEach(b=>b.onclick=()=>{
    const oo=+b.dataset.move, reason=b.dataset.movereason;
    const t=team(); const rc=paLast(t,oo,W.i); if(!rc) return;
    const cur = rc.advances&&rc.advances.length? rc.advances[rc.advances.length-1].toBase : rc.reachedBase;
    if(cur>=4) return;
    rc.advances = rc.advances||[];
    rc.advances.push({toBase:cur+1, reason, duringOrder:W.o});
    if(cur+1===4) rc.run=true;
    scheduleSave(); renderBoard(); renderWizard();
  });
  // adv
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{ W.resultText=b.dataset.a; W.color="black"; renderWizard(); });
  document.querySelectorAll("[data-ab]").forEach(b=>b.onclick=()=>{ W.reachedBase=+b.dataset.ab; if(W.reachedBase===4)W.run=true; renderWizard(); });
  // run / rbi
  const run=document.getElementById("wRun"); if(run) run.onchange=()=>{ W.run=run.checked; renderWizard(); };
  document.querySelectorAll("[data-rbi]").forEach(b=>b.onclick=()=>{ W.rbi=Math.max(0,Math.min(4,W.rbi+ +b.dataset.rbi)); renderWizard(); });
  // quick results
  document.querySelectorAll("[data-quick]").forEach(b=>b.onclick=()=>{
    const q=b.dataset.quick;
    W.advances=[]; W.sacBunt=false; W.sacFly=false; W.fielders=[]; W._ot=null; W._touchBase=null; W.quality=null;
    if(q==="B"||q==="HP"){ W.category="walk"; W.resultText=q; W.reachedBase=1; W.color="blue"; W.outNumber=null; }
    else if(q==="K"){ W.category="out"; W._ot="K"; W.resultText="K"; W.reachedBase=0; W.color="black"; autoOut(); }
    renderWizard();
  });
  // actions
  document.getElementById("wCancel").onclick=wizClose;
  const wc=document.getElementById("wClear"); if(wc) wc.onclick=()=>{ const t=team(); paPopLast(t,W.o,W.i); scheduleSave(); wizClose(); renderBoard(); };
  const ok=document.getElementById("wOk"); if(ok) ok.onclick=()=>commitWizard(false);
  const okn=document.getElementById("wOkNext"); if(okn) okn.onclick=()=>commitWizard(true);
}
function outResultText(){ return (W._ot==="foulfly"?"F":"") + W.fielders.join("-") + (W._touchBase?({1:"A",2:"B",3:"C",4:"D"}[W._touchBase]):""); }
function autoOut(){
  const t=team(); let outs=0;
  for(let o=1;o<=9;o++){ if(o===W.o) continue; paList(t,o,W.i).forEach(c=>{ if(c.outNumber) outs++; }); }
  W.outNumber = Math.min(3, outs+1);
}
function commitWizard(advance){
  const t=team();
  const o=W.o, i=W.i;
  const cell=buildCell();
  if(S.view==="live"){
    paPush(t,o,i,cell);
    if(cell.reachedBase>=1 && (cell.category==="hit"||cell.category==="err")) pushRunnersFor(t,i,cell.reachedBase,o);
    if(cell.reachedBase===4) cell.run=true;
    S.live.pitches=[]; S.live.order[battingSide()]=nextOrder(o);
    scheduleSave(); wizClose(); finalizeLive(); return;
  }
  paSetLast(t,o,i,cell);
  scheduleSave(); wizClose(); renderSheet();
  if(advance && outsInInning(t,i)<3){ openWizard(nextOrder(o), i); }
}

/* ---------------- team roster (persistent) ---------------- */
function openRoster(backFn){
  let h=`<h2>自チームの選手名簿</h2><div class="sub">チーム名・選手名・背番号を保存しておくと、毎試合それを呼び出せます。ここは「保存して新規」にしても消えません。</div>`;
  h+=`<div class="field"><label>自チーム名</label><input id="rTeam" value="${esc(ROSTER_TEAM)}" placeholder="例）〇〇クラブ"></div>`;
  h+=`<div class="step-title">選手（名前・背番号）</div>`;
  h+=`<div class="plist" id="rosterList">`;
  if(!ROSTER.length) h+=`<div class="hint" style="padding:.2rem 0">まだ登録がありません。「＋ 追加」から入力してください。</div>`;
  ROSTER.forEach((p,idx)=> h+=`<div class="prow" data-ridx="${idx}" style="grid-template-columns:1fr 4rem 2rem">
      <input class="rName" placeholder="選手名" value="${esc(p.name)}">
      <input class="rNum" placeholder="背番" inputmode="numeric" value="${esc(p.num)}">
      <button class="chip" data-rdel="${idx}" style="padding:.3rem 0">✕</button></div>`);
  h+=`</div><div class="modal-actions"><button class="btn" id="rAdd">＋ 追加</button><span class="spacer"></span><button class="btn primary" id="rDone">閉じる</button></div>`;
  showModal(h);
  document.getElementById("rTeam").oninput=e=>{ ROSTER_TEAM=e.target.value; saveRoster(); };
  document.querySelectorAll("#rosterList .prow").forEach(row=>{
    const idx=+row.dataset.ridx;
    row.querySelector(".rName").oninput=e=>{ ROSTER[idx].name=e.target.value; saveRoster(); };
    row.querySelector(".rNum").oninput=e=>{ ROSTER[idx].num=e.target.value; saveRoster(); };
  });
  document.querySelectorAll("[data-rdel]").forEach(b=>b.onclick=()=>{ ROSTER.splice(+b.dataset.rdel,1); saveRoster(); openRoster(backFn); });
  document.getElementById("rAdd").onclick=()=>{ ROSTER.push({name:"",num:""}); saveRoster(); openRoster(backFn); };
  document.getElementById("rDone").onclick=()=>{ if(backFn) backFn(); else closeModal(); };
}
function rosterFill(tm){
  if(ROSTER_TEAM){ tm.name=ROSTER_TEAM; if(tm===S.teams.home) S.meta.home=ROSTER_TEAM; else S.meta.away=ROSTER_TEAM; }
  for(let o=1;o<=9 && o<=ROSTER.length;o++){ const r=ROSTER[o-1]; if(r.name){ tm.players[o-1].name=r.name; tm.players[o-1].num=r.num; } }
}

function runnerOutMenu(t,r,i,dur){
  let flds=[];
  function draw(){
    let h=`<h2>${r.order}番 ${esc(r.name)} をアウト</h2><div class="sub">アウトにした野手を順にタップ（併殺の連携など。例：3-6）。無ければ「×だけ」で記録します。</div>`;
    h+=`<div class="chips"><span class="chip" style="border-style:dashed">${flds.join("-")||"—"}</span><button class="chip" data-ru="undo">←戻す</button></div>`;
    h+=`<div class="grid9">`;
    for(let n=1;n<=9;n++) h+=`<button class="chip num" data-rf="${n}">${n} ${POS[n-1]}</button>`;
    h+=`</div>`;
    h+=`<div class="modal-actions"><button class="btn" id="ruPlain">×だけ</button><span class="spacer"></span><button class="btn ghost" id="ruCancel">キャンセル</button><button class="btn primary" id="ruOk">アウトで確定</button></div>`;
    showModal(h);
    document.querySelectorAll("[data-rf]").forEach(b=>b.onclick=()=>{ flds.push(+b.dataset.rf); draw(); });
    const u=document.querySelector('[data-ru="undo"]'); if(u) u.onclick=()=>{ flds.pop(); draw(); };
    document.getElementById("ruPlain").onclick=()=>{ outRunnerCell(t,r.order,i,dur,"×"); scheduleSave(); closeModal(); finalizeLive(); };
    document.getElementById("ruCancel").onclick=closeModal;
    document.getElementById("ruOk").onclick=()=>{ outRunnerCell(t,r.order,i,dur, flds.length?flds.join("-"):"×"); scheduleSave(); closeModal(); finalizeLive(); };
  }
  draw();
}

/* ---------------- pitchers ---------------- */

function openPlayers(o){

function playerRow(o,p,isSub,idx){
  const posOpts=`<option value="">位置</option>`+POS.map(x=>`<option ${p.pos===x?"selected":""}>${x}</option>`).join("");
  const batOpts=BATS.map(x=>`<option ${p.bats===x?"selected":""}>${x}</option>`).join("");
  const hasR=ROSTER.length>0;
  const rSel=hasR?`<select class="pRoster"><option value="">名簿</option>${ROSTER.map((r,ri)=>`<option value="${ri}">${esc(r.name)||"(無名)"}${r.num?(" #"+esc(r.num)):""}</option>`).join("")}</select>`:"";
  const innField=isSub?`<input class="pInn" placeholder="回" inputmode="numeric" value="${p.atInning||''}">`:"";
  const cols=hasR
    ? (isSub?"1.4rem 4.2rem 3rem 1fr 2.4rem 2.2rem 2.6rem":"1.4rem 4.2rem 3rem 1fr 2.4rem 2.2rem")
    : (isSub?"1.4rem 3.2rem 1fr 2.6rem 2.4rem 2.6rem":"1.4rem 3.2rem 1fr 2.6rem 2.4rem");
  return `<div class="prow" data-sub="${isSub?1:0}" data-idx="${idx}" style="grid-template-columns:${cols}">
    <span class="o">${isSub?"→":o}</span>
    ${rSel}
    <select class="pPos">${posOpts}</select>
    <input class="pName" placeholder="${isSub?"控え選手名":"選手名"}" value="${esc(p.name)}">
    <input class="pNum" placeholder="背番" value="${esc(p.num)}">
    <select class="pBat">${batOpts}</select>
    ${innField}
  </div>`;
}
function bindPlayerRow(o,p,isSub,idx,cb){
  const rows=[...document.querySelectorAll(`.prow[data-sub="${isSub?1:0}"]`)];
  const row=isSub?rows[idx]:rows[0];
  if(!row) return;
  const rs=row.querySelector(".pRoster");
  if(rs) rs.onchange=e=>{ const ri=e.target.value; if(ri!==""){ const r=ROSTER[+ri]; p.name=r.name; p.num=r.num; row.querySelector(".pName").value=r.name; row.querySelector(".pNum").value=r.num; cb(); } };
  const pi=row.querySelector(".pInn"); if(pi) pi.oninput=e=>{ p.atInning=parseInt(e.target.value)||""; cb(); renderBoard(); };
  row.querySelector(".pPos").onchange=e=>{ p.pos=e.target.value; cb(); renderBoard(); };
  row.querySelector(".pName").oninput=e=>{ p.name=e.target.value; cb(); };
  row.querySelector(".pNum").oninput=e=>{ p.num=e.target.value; cb(); };
  row.querySelector(".pBat").onchange=e=>{ p.bats=e.target.value; cb(); };
}

function saveMidGame(){  const inn=Math.max(1, parseInt(val("mgInn"))||1);

  const outs=parseInt(document.getElementById("mgOuts").value)||0;
  const order=parseInt(document.getElementById("mgOrder").value)||1;

  if(inn>S.innings) S.innings=inn;

  for(let o=1;o<=9;o++){ const l=paList(tm,o,inn).filter(c=>!c.manual); if(l.length) tm.cells[cellKey(o,inn)]=l; else delete tm.cells[cellKey(o,inn)]; }

function bindLive(){
  document.querySelectorAll("[data-lp]").forEach(b=>b.onclick=()=>livePitch(b.dataset.lp));

}
function openScoreEdit(k,n){
  const tm=S.teams[k];

  let v=(S.pre.runs[k]&&S.pre.runs[k][n])||0;
  let h=`<h2>${esc(tm.name)}　${n}回の得点</h2>`;
  h+= auto>0
    ? `<div class="sub">打席の記録から自動集計：${auto}点。ここで入れた手入力分が加算されます。</div>`
    : `<div class="sub">打席を1つずつ記録しない相手チームなどは、ここで得点だけ入力できます。</div>`;

        <span style="color:var(--muted)">手入力の得点</span>

      </div>`;

}
function renderBoard(){ if(S.view==="live") renderLive(); else renderSheet(); }
function livePitch(kind){
  S.live.pitches.push(kind);
  const {b,s}=countBS();
  if(b>=4){ liveWalk("B"); return; }
  if(s>=3){ liveK(); return; }
  scheduleSave(); renderLive();
}
function liveWalk(kind){
  const t=liveTeam(), i=S.live.inning, o=liveOrder();
  pushRunnersFor(t,i,1,o);
  paPush(t,o,i,{category:"walk",resultText:kind,reachedBase:1,color:"blue",quality:null,sacBunt:false,sacFly:false,fielders:[],advances:[],run:false,rbi:0,pitches:[...S.live.pitches]});
  S.live.pitches=[]; S.live.order[battingSide()]=nextOrder(o);
  scheduleSave(); renderLive();
}
function liveK(){
  const t=liveTeam(), i=S.live.inning, o=liveOrder();
  const c={category:"out",resultText:"K",reachedBase:0,color:"black",quality:null,sacBunt:false,sacFly:false,fielders:[],advances:[],run:false,rbi:0,pitches:[...S.live.pitches]};
  c.outNumber=Math.min(3, teamOuts(t,i)+1);
  paPush(t,o,i,c);
  S.live.pitches=[]; S.live.order[battingSide()]=nextOrder(o);
  scheduleSave(); finalizeLive();
}
function liveResult(cat){ S.active=battingSide(); openWizard(liveOrder(), S.live.inning, cat); }
function changeHalf(){
  S.live.over=false;
  S.live.pitches=[];
  if(S.live.half==="top"){ S.live.half="bottom"; }
  else { S.live.half="top"; S.live.inning++; if(S.live.inning>S.innings) S.innings=S.live.inning; }
  scheduleSave(); renderLive();
}
function gameOverAfterHalf(){
  const REG=9;
  if(S.live.inning<REG) return false;
  if(S.live.half==="bottom") return totalRuns("home")!==totalRuns("away");
  if(S.live.half==="top") return totalRuns("home")>totalRuns("away");
  return false;
}
function finalizeLive(){
  const t=liveTeam(), i=S.live.inning;
  if(teamOuts(t,i)>=3){
    if(gameOverAfterHalf()){ S.live.over=true; S.live.pitches=[]; scheduleSave(); renderLive(); return; }
    changeHalf();
  } else renderLive();
}

function swapTeams(){
  const t=S.teams.home; S.teams.home=S.teams.away; S.teams.away=t;
  const mh=S.meta.home; S.meta.home=S.meta.away; S.meta.away=mh;

`;
function pdfFileBase(){
  const m=S.meta;
  const ymd=(m.date||today()).replace(/-/g,"");
  const away=m.away||"ビジター", home=m.home||"ホーム";
  return `${ymd}_${away}[${totalRuns("away")}]vs[${totalRuns("home")}]${home}`;
}
function buildPrintHTML(){
  const prev=S.active;
  const m=S.meta; const title=[m.date,m.tourney,(m.away+" vs "+m.home),m.ground].filter(Boolean).join("　");
  const header=`<h2>スコアブック</h2><div style="color:#666;font-size:13px;margin-bottom:8px">${esc(title)}</div>`;
  const board=scoreboardHTML();
  let pages="";
  ["away","home"].forEach((k,i)=>{
    S.active=k;
    const teamBlock=`<h3>${esc(S.teams[k].name)}</h3>`+pitchersLine(S.teams[k],k)+sheetTableHTML(S.teams[k]);
    const isFirst=i===0, isLast=i===1;
    pages+=`<div class="team-page">${isFirst?header+board:""}${teamBlock}${isLast?legendHTML():""}</div>`;
  });
  S.active=prev;
  return `<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(pdfFileBase())}</title><style>${PRINT_CSS}</style></head><body>`+
    `<div class="printbar"><button onclick="window.print()">印刷 / PDFで保存</button></div>`+
    pages+`</body></html>`;
}
function legendHTML(){
  return `<div class="legend"><b>凡例</b>　守備位置：投1 捕2 一3 二4 三5 遊6 左7 中8 右9 ／ DH=D。安打=赤線・得点=ダイヤ塗り。K=三振、B=四球、HP=死球、IB=故意四球、E=失策、DP=併殺、×=走者アウト、犠打=□囲み・犠飛=△囲み。S=盗塁、W=暴投、P=捕逸、BK=ボーク。アウトは野手を連携順に（例 6-3）、自分で塁を踏めば番号+塁記号（A一・B二・C三・D本、例 3A/6B）。ボールカウント：●ボール／×見逃し／⊗空振り／△ファウル、✓＝その投球時に走者が動いた。色：赤＝安打・得点、青＝四死球・犠打犠飛。</div>`;
}
function pitchersLine(tm,k){
  const ps=(tm.pitchers||[]).filter(p=>p.name); if(!ps.length) return "";
  const opp=k==="away"?"home":"away"; const oppTeam=S.teams[opp];
  return `<div style="font-size:12px;color:#333;margin:2px 0 5px">投手：${ps.map(p=>{
    const vs=p.vsOrder&&oppTeam?currentPlayer(oppTeam,p.vsOrder):null;
    const vsLabel=(vs&&vs.name)?`・対${p.vsOrder}番 ${esc(vs.name)}から`:"";
    return esc(p.name)+(p.num?(" #"+esc(p.num)):"")+(p.from?`（${p.from}回〜${vsLabel}）`:vsLabel?`（${vsLabel.replace(/^・/,"")}）`:"");
  }).join("、 ")}</div>`;
}
async function exportSheet(){
  const html=buildPrintHTML();
  try{
    if(window.claude && window.claude.use){
      const d=await window.claude.use("downloads");
      if(d){
        const fn=pdfFileBase().replace(/\s+/g,"")+".html";
        await d.save({filename:fn, data:html});
        showModal(`<h2>書き出しました</h2><div class="sub">保存した「${esc(fn)}」を開き、上部の「印刷 / PDFで保存」ボタンから、お使いのブラウザでPDFとして保存・印刷できます。</div><div class="modal-actions"><span class="spacer"></span><button class="btn primary" id="exOk">OK</button></div>`);
        const ok=document.getElementById("exOk"); if(ok) ok.onclick=closeModal;
        return;
      }
    }
  }catch(e){ if(e&&e.code==="declined") return; }
  printHTML(html);
}
function printHTML(html){
  // スマホのブラウザは、スクリプトからの自動印刷（隠しiframeでのprint()や、
  // window.open()の連続呼び出し）を「自動的な動作」としてブロックすることがあるため、
  // Blob URLへの通常のリンククリックとしてスコアシートを新しいタブで開き、
  // ページ上の「印刷 / PDFで保存」ボタンをユーザー自身に押してもらう方式にする。
  try{
    const blob=new Blob([html], {type:"text/html"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.target="_blank"; a.rel="noopener";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){
    showModal(`<h2>新しいタブを開けませんでした</h2><div class="sub">ポップアップがブロックされた可能性があります。ブラウザの設定でこのサイトのポップアップを許可してから、もう一度お試しください。</div><div class="modal-actions"><span class="spacer"></span><button class="btn primary" id="exOk2">OK</button></div>`);
    const ok=document.getElementById("exOk2"); if(ok) ok.onclick=closeModal;
  }
}

/* ---------------- backup (export / import all data) ---------------- */
function backupPayload(){
  return { app:"scorebook", version:2, exportedAt:new Date().toISOString(), game:S, roster:{name:ROSTER_TEAM, players:ROSTER}, history:HISTORY };
}
async function exportBackup(){
  archiveCurrentGame();
  const data=JSON.stringify(backupPayload(), null, 2);
  const fn=("スコアブック_バックアップ_"+(S.meta.date||today())).replace(/\s+/g,"")+".json";
  try{
    if(window.claude && window.claude.use){
      const d=await window.claude.use("downloads");
      if(d){ await d.save({filename:fn, data}); return true; }
    }
  }catch(e){ if(e&&e.code==="declined") return false; }
  try{
    const blob=new Blob([data],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=fn; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    return true;
  }catch(e){ return false; }
}
function importBackupFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    let data;
    try{ data=JSON.parse(reader.result); }
    catch(e){ data=null; }
    if(!data || !data.game){
      showModal(`<h2>読み込みに失敗しました</h2><div class="sub">スコアブックのバックアップファイルではないようです。</div><div class="modal-actions"><span class="spacer"></span><button class="btn primary" id="ibOk">閉じる</button></div>`);
      document.getElementById("ibOk").onclick=closeModal;
      return;
    }
    confirmImport(data);
  };
  reader.readAsText(file);
}
function confirmImport(data){
  showModal(`<h2>バックアップを復元しますか？</h2><div class="sub">現在の試合データは上書きされます。この操作は取り消せません。</div>
    <div class="modal-actions"><span class="spacer"></span><button class="btn ghost" id="imCancel">キャンセル</button><button class="btn danger" id="imOk">復元する</button></div>`);
  document.getElementById("imCancel").onclick=closeModal;
  document.getElementById("imOk").onclick=()=>{
    S=data.game; migrate();
    if(data.roster){ ROSTER=data.roster.players||[]; ROSTER_TEAM=data.roster.name||""; saveRoster(); }
    if(Array.isArray(data.history)){
      data.history.forEach(h=>{ const idx=HISTORY.findIndex(x=>x.id===h.id); if(idx>=0) HISTORY[idx]=h; else HISTORY.push(h); });
      saveHistory();
    }
    save(); closeModal(); renderAll();
    showModal(`<h2>復元しました</h2><div class="modal-actions"><span class="spacer"></span><button class="btn primary" id="imDone">OK</button></div>`);
    document.getElementById("imDone").onclick=closeModal;
  };
}
function openBackup(){
  showModal(`<h2>データのバックアップ</h2>
    <div class="sub">試合の記録は自動でこの端末に保存されますが、機種変更やアプリの再インストールに備えて、バックアップファイルを保存しておくと安心です。</div>
    <div class="modal-actions"><button class="btn primary" id="bkExport">バックアップを保存</button></div>
    <div class="field"><label>バックアップから復元</label><input type="file" accept="application/json" id="bkFile"></div>
    <div class="modal-actions"><span class="spacer"></span><button class="btn ghost" id="bkClose">閉じる</button></div>`);
  document.getElementById("bkExport").onclick=async()=>{
    const ok=await exportBackup();
    if(ok===false) return;
    showModal(`<h2>保存しました</h2><div class="sub">バックアップファイルを保存先やクラウドストレージに控えておくと安心です。</div><div class="modal-actions"><span class="spacer"></span><button class="btn primary" id="bkDone">OK</button></div>`);
    document.getElementById("bkDone").onclick=closeModal;
  };
  document.getElementById("bkFile").onchange=(e)=>{ const f=e.target.files[0]; if(f) importBackupFile(f); };
  document.getElementById("bkClose").onclick=closeModal;
}

      <button class="btn danger" id="moNew">保存して新規</button>
    </div>
    <div class="modal-actions"><span class="spacer"></span><button class="btn ghost" id="moClose">閉じる</button></div>`);
  document.getElementById("moSetup").onclick=()=>{ closeModal(); openSetup(); };
  document.getElementById("moInning").onclick=()=>{ closeModal(); extendInning(); };
  document.getElementById("moPrint").onclick=()=>{ closeModal(); exportSheet(); };
  document.getElementById("moHistory").onclick=()=>{ closeModal(); openHistory(); };
  document.getElementById("moBackup").onclick=()=>{ closeModal(); openBackup(); };
  document.getElementById("moNew").onclick=()=>{ closeModal(); confirmNew(); };
  document.getElementById("moClose").onclick=closeModal;
}

/* ---------------- boot ---------------- */
document.getElementById("btnView").onclick=()=>{ S.view = S.view==="live"?"grid":"live"; scheduleSave(); renderAll(); };
document.getElementById("btnMenu").onclick=openMenu;
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
const _fresh=!load();
if(_fresh) S=newGame();
migrate();
loadRoster();
loadHistory();
if(_fresh) applySavedTeam();
renderAll();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
